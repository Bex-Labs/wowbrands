<svg width="128" height="128" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ledger mark">
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#191712"/>
  <!-- tally of five: four verticals struck through -->
  <g stroke="#EAE4D3" stroke-width="5" stroke-linecap="round">
    <line x1="20" y1="16" x2="20" y2="48"/>
    <line x1="28" y1="16" x2="28" y2="48"/>
    <line x1="36" y1="16" x2="36" y2="48"/>
    <line x1="44" y1="16" x2="44" y2="48"/>
    <line x1="14" y1="50" x2="50" y2="14"/>
  </g>
  <!-- brand accent dot, echoes the wordmark's dot -->
  <circle cx="52" cy="13" r="4" fill="#C1442D"/>
</svg>
